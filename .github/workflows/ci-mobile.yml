name: CI — Mobile

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/ci-mobile.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/mobile/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.22.0"

jobs:
  analyze-and-test:
    name: Analyze, Format & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: cd apps/mobile && flutter pub get

      - name: Verify formatting
        run: cd apps/mobile && dart format --output=none --set-exit-if-changed .

      - name: Analyze (flutter analyze)
        run: cd apps/mobile && flutter analyze --fatal-infos --fatal-warnings

      - name: Run unit & widget tests
        run: cd apps/mobile && flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: apps/mobile/coverage/lcov.info

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: cd apps/mobile && flutter pub get

      - name: Build release APK
        run: cd apps/mobile && flutter build apk --release --obfuscate --split-debug-info=build/debug-info

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cashora-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
