name: CI — Backend

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/backend/**"
      - "packages/api-contracts/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/backend/**"
      - "packages/api-contracts/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=512m"

jobs:

  # ─── Build & Test ─────────────────────────────────────────────────────────
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cashora_test
          POSTGRES_USER: cashora_test
          POSTGRES_PASSWORD: cashora_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup JDK ${{ env.JAVA_VERSION }} (Temurin)
        uses: actions/setup-java@8df103969634f86d64471153f9757650f2292f75 # v4.3.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@218a5b28d7d9147e0aa06c1157b83141f215bf28 # v3.5.0

      - name: Grant Gradle execute permission
        run: chmod +x apps/backend/gradlew

      - name: Lint (ktlint)
        run: cd apps/backend && ./gradlew ktlintCheck

      - name: Static analysis (detekt)
        run: cd apps/backend && ./gradlew detekt

      - name: Build all modules
        run: cd apps/backend && ./gradlew build -x test

      - name: Run tests with coverage
        run: cd apps/backend && ./gradlew test jacocoTestReport
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: cashora_test
          POSTGRES_USER: cashora_test
          POSTGRES_PASSWORD: cashora_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e28b429e5bfd82765703197d59b028852467d393 # v4.5.0
        with:
          files: apps/backend/**/build/reports/jacoco/test/jacocoTestReport.xml

      - name: Upload test results
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65822d53b0ed39962a # v4.4.3
        if: always()
        with:
          name: backend-test-results
          path: apps/backend/**/build/test-results/

  # ─── SAST / Security Scan ─────────────────────────────────────────────────
  security:
    name: SAST & Dependency Scan
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Semgrep SAST
        uses: semgrep/semgrep-action@16bf33bfa861962329ebc8fc11261d7b1a20d442 # v1
        with:
          config: |
            p/kotlin
            p/owasp-top-ten
            p/spring

      - name: OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@0f7fbc393ef69b3bf2d4c06f1d2448408f6230f2 # main
        with:
          project: cashora-backend
          path: apps/backend
          format: HTML

      - name: Container image scan (Trivy)
        uses: aquasecurity/trivy-action@6e7b7d14e76a690184a4412c1c6edc86996d98f7 # master
        with:
          scan-type: fs
          scan-ref: apps/backend
          severity: HIGH,CRITICAL
          exit-code: 1
